name: Test and build cabinet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cabinet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.2'
      - name: Check source distribution
        run: node tools/check-release.mjs
      - name: Set up Python for diagnostic bridge unit tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.28.2 --ignore-scripts --no-audit --no-fund
      - name: Install frontend from committed lockfile
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test backend, frontend and backup tools
        run: npm test
      - name: Test diagnostic bridge without vendor transport
        run: python -m unittest discover -s tests -p test_live_bridge.py
      - name: Build frontend
        run: pnpm --dir frontend run build
      - name: Build isolated runtime image
        run: docker build --pull --tag camera-pilot-ci:${{ github.sha }} .
      - name: Start disposable container and verify auth
        run: bash deploy/container-smoke.sh camera-pilot-ci:${{ github.sha }}
